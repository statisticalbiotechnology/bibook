version: 1
project:
  title: Bioinformatics for Biotechnology Students
  authors:
    - name: Lukas Käll
  github: statisticalbiotechnology/bibook
  jupyter: true
  thebe:
    binder:
      repo: statisticalbiotechnology/bibook
      provider: github
      url: https://mybinder.org
      ref: main
  numbering:
    # Chapters sit one level below a part page, so they number as 1.1, 1.2, ...
    # The part pages override this with offset 0 in their own frontmatter.
    title:
      enabled: true
      offset: 1
  bibliography:
    - references.bib
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/bibook.pdf
      authors:
        - name: LUKAS KÄLL \& ANDERS ANDERSSON
  toc:
    - file: intro.md
    - file: alignment/index.md
      children:
        - title: Introduction to Alignments
          children:
            - file: alignment/introduction/intro.md
            - file: alignment/introduction/alignment_algorithm.md
        - title: Algorithms for Pairwise Alignments
          children:
            - file: alignment/pairwise/needleman.md
            - file: alignment/pairwise/nw_code.md
            - file: alignment/pairwise/waterman.md
            - file: alignment/pairwise/sw_code.ipynb
            - file: alignment/pairwise/semi.md
            - file: alignment/pairwise/sg_code.ipynb
        - title: Protein Sequence Alignment
          children:
            - file: alignment/protein/matrix.ipynb
            - file: alignment/protein/prot_code.ipynb
        - title: Multiple Sequence Alignments
          children:
            - file: alignment/msa/progressive.md
            - file: alignment/msa/msa.ipynb
            - file: alignment/msa/seqlogo.ipynb
            - file: alignment/msa/profileHMM.md
            - file: alignment/msa/viterbi.ipynb
        - title: Sequence Retrieval
          children:
            - file: alignment/retrieval/blast.md
            - file: alignment/retrieval/blast_code.ipynb
    - file: phylogenetics/index.md
      children:
        - title: Introduction to Phylogenetics
          children:
            - file: phylogenetics/introduction/intro.md
            - file: phylogenetics/introduction/data.md
        - title: Distance-Based Phylogenetics
          children:
            - file: phylogenetics/distance/distances.md
            - file: phylogenetics/distance/distances_code.ipynb
            - file: phylogenetics/distance/upgma.md
            - file: phylogenetics/distance/neighbor_joining.md
        - title: Character-Based Phylogenetics
          children:
            - file: phylogenetics/character/parsimony.md
            - file: phylogenetics/character/likelihood.md
            - file: phylogenetics/character/bayesian_inference.md
        - title: Interpreting Phylogenetic Trees
          children:
            - file: phylogenetics/interpretation/rooting.md
            - file: phylogenetics/interpretation/support.md
  downloads:
    - url: https://193.10.159.40.nip.io/hub/user-redirect/git-pull?repo=https://github.com/statisticalbiotechnology/bibook&urlpath=lab/tree/bibook/bibook&branch=main
      title: Run on the KTH JupyterHub
site:
  options:
    logo: bibook.webp
    folders: true
  template: book-theme
